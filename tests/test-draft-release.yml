name: Test draft release creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          tag_name: v2.0.0-draft
          name: "Draft Release v2.0.0"
          body: "This is a draft release for testing."
          draft: "true"
      - name: Assert action ran (success with outputs or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ID: ${{ steps.action.outputs.id }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "id: $ID"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ID" ]; then
              echo "FAIL: action succeeded but 'id' output is empty"
              exit 1
            fi
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but 'url' output is empty"
              exit 1
            fi
            echo "PASS: draft release created with id=$ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
